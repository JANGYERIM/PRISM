model:
  name: RFDecoder
  output_dim: 263
  noise_std: 1.0
  post_refinement: false  # x0만 달라지고, y는 그대로 예측값 사용 |true: x0 = vqvae_out + noise_std*N(0,1) (PostRefinement). false: x0 = 순수 N(0,1) (vanilla flow matching)
  use_diffusion_pos_embed: false
  text_condition: true
  Unet1D:
    use: false
    dim: 512
    dim_mults:
    - 1
    - 2
    c_in_dim: 512
    c_proj_dim: 256
    up_conv_c: Repeat_and_stack_and_linear
    dropout: 0.0
    learned_variance: false
    learned_sinusoidal_cond: false
    random_fourier_features: false
    learned_sinusoidal_dim: 16
    sinusoidal_pos_emb_theta: 10000
    use_attention: false
    attn_dim_head: 32
    attn_heads: 4
  DiT:
    use: true
    c_in_dim: 512
    c_proj_dim: 384
    hidden_size: 512
    num_heads: 4
    mlp_ratio: 4
    num_layers: 4
    max_seq_len: 200
    t5_version: google/t5-v1_1-base
    t5_max_text_len: 20
  Reflow: false
  vqvae_weight_path: ./checkpoints/MoScale/checkpoints/net_best_fid.tar
train:
  ema_rate: 0.999
  vqvae_inference: false
  full_motion: true
  num_epochs: 300
  lr: 0.0005
  scheduler: cosine_warmup
  min_lr: 1.0e-05
  max_grad_norm: 1.0
  recon_loss: l1_smooth
  save_every: 2
  save_dir: ./checkpoints
  log_step: 10
  batch_size: 384
  recon_weight: 1.0
val:
  batch_size: 512
utils:
  seed: 42
